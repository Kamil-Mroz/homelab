- resources:
    cpu: true
    memory: true
    disk:
      - /
      - /mnt/storage
      - /mnt/backups


- datetime:
    text_size: xl
    locale: pl
    format:
      timeStyle: short
      dateStyle: short
      hourCycle: h23

